# Packages and publishes the three binding artifacts:
#   - PyPI: wheel + sdist        (bindings/python)
#   - npm: tgz                   (bindings/nodejs)
#   - NuGet: nupkg with win-x64 + linux-x64 natives (bindings/csharp)
#
# Trigger: version tag (v0.2.0, ...) publishes to the live registries;
# manual dispatch performs a dry run (pack + validate + upload artifacts,
# no registry push) unless `publish` is set to true.
#
# The package jobs only build and validate. A single `publish` job pushes to
# all three registries after every package has passed, so one broken package
# cannot leave the others released on their own. Its pushes skip versions
# that are already published: rerun the workflow after fixing a failed push.
#
# Required repository secrets for publishing:
#   PYPI_API_TOKEN, NPM_TOKEN, NUGET_API_KEY

name: release-packages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to registries (false = dry-run pack only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version consistency
        run: python scripts/check_release.py
      - name: Tag and finalized release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Manual publication requires finalized notes
        if: inputs.publish
        run: python scripts/check_release.py --release

  natives:
    needs: [release-metadata]
    uses: ./.github/workflows/native-build.yml

  python-package:
    runs-on: ubuntu-22.04
    needs: [natives]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download linux native
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: natives/linux/

      - name: Download windows native
        uses: actions/download-artifact@v8
        with:
          name: native-win-x64
          path: natives/windows/

      # One wheel per platform, each with exactly its own native (never a
      # py3-none-any wheel with a DLL and an SO mixed together), plus a
      # source-only sdist. setuptools stages package files in build/lib and
      # never prunes it, so without the wipe before each wheel the win_amd64
      # wheel would also carry the libtacuda.so staged for the Linux one.
      - name: Build sdist + platform wheels
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade build twine
          rm -rf build dist ./*.egg-info
          python -m build --sdist

          rm -rf build ./*.egg-info
          cp "$GITHUB_WORKSPACE/natives/linux/libtacuda.so" tacuda/
          printf '[bdist_wheel]\nplat_name = manylinux_2_35_x86_64\npython_tag = py3\n' > setup.cfg
          python -m build --wheel
          rm tacuda/libtacuda.so

          rm -rf build ./*.egg-info
          cp "$GITHUB_WORKSPACE/natives/windows/tacuda.dll" tacuda/
          printf '[bdist_wheel]\nplat_name = win_amd64\npython_tag = py3\n' > setup.cfg
          python -m build --wheel
          rm -rf tacuda/tacuda.dll setup.cfg build ./*.egg-info

          python -m twine check dist/*

      # Exact expectations rather than grep: under `set -e` bash ignores a
      # failing `! cmd`, so the earlier negated checks could never fail.
      - name: Validate dist contents (one native per platform wheel)
        working-directory: bindings/python
        shell: python
        run: |
          import pathlib, tarfile, zipfile
          natives = (".so", ".dll", ".dylib", ".pyd")
          expected = {"manylinux_2_35_x86_64": {"tacuda/libtacuda.so"},
                      "win_amd64": {"tacuda/tacuda.dll"}}
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          plats = sorted(w.name[:-len(".whl")].rsplit("-", 1)[1] for w in wheels)
          assert plats == sorted(expected), f"expected one wheel per {sorted(expected)}, got {[w.name for w in wheels]}"
          for wheel in wheels:
              plat = wheel.name[:-len(".whl")].rsplit("-", 1)[1]
              found = {n for n in zipfile.ZipFile(wheel).namelist() if n.endswith(natives)}
              assert found == expected[plat], f"{wheel.name}: natives {sorted(found)}, expected {sorted(expected[plat])}"
              print(f"{wheel.name}: {sorted(found)}")
          sdists = sorted(pathlib.Path("dist").glob("*.tar.gz"))
          assert len(sdists) == 1, f"expected one sdist, got {[s.name for s in sdists]}"
          with tarfile.open(sdists[0]) as sdist:
              found = [n for n in sdist.getnames() if n.endswith(natives)]
          assert not found, f"{sdists[0].name} must be source-only, contains {found}"
          print(f"{sdists[0].name}: source-only")

      - name: Smoke-test wheel installs
        # Run from an empty directory so the import resolves the INSTALLED
        # wheel from site-packages, never the source tree.
        run: |
          python -m pip install bindings/python/dist/*manylinux*.whl numpy
          mkdir -p /tmp/wheel-smoke && cd /tmp/wheel-smoke
          python - <<'PY'
          # No GPU on this runner: assert the package resolves its native and
          # fails only at CUDA library load, not with packaging errors.
          import importlib.util, pathlib
          spec = importlib.util.find_spec("tacuda")
          assert spec is not None, "tacuda not importable after wheel install"
          origin = pathlib.Path(spec.origin).resolve()
          assert "site-packages" in str(origin), (
              f"import must resolve the installed wheel, got {origin}")
          native = origin.parent / "libtacuda.so"
          assert native.exists(), f"packaged native missing: {native}"
          try:
              import tacuda  # noqa: F401 - full import needs CUDA runtime
              print("import OK (CUDA runtime present)")
          except OSError as exc:
              msg = str(exc)
              assert "libtacuda" in msg or "libcudart" in msg or "cuda" in msg.lower(), (
                  "unexpected import failure: " + msg)
              print("native found, load fails only due to missing CUDA runtime (expected on CPU runner)")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: bindings/python/dist/*
          if-no-files-found: error

  npm-package:
    runs-on: ubuntu-22.04
    # Gate on the same native-build workflow (incl. the mandatory GPU tests
    # on tags) as the other packages.
    needs: [natives]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Pack
        working-directory: bindings/nodejs
        run: |
          npm install --no-audit --no-fund
          npm pack

      - name: Smoke-test the PACKED tarball
        run: |
          # Install the actual .tgz into a scratch project and require the
          # INSTALLED package (never the source index.js). Without a native
          # library the only acceptable failure is the missing-native error.
          mkdir -p /tmp/npm-smoke && cd /tmp/npm-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/bindings/nodejs/tacuda-*.tgz
          node - <<'JS'
          try {
            const t = require('tacuda');
            console.log('installed package loads (native present), exports:', Object.keys(t).length);
          } catch (e) {
            const msg = String(e && e.message || e);
            if (!/Failed to load shared library|tacuda|libcudart/i.test(msg)) {
              console.error('unexpected load failure:', msg);
              process.exit(1);
            }
            console.log('installed package parses; load fails only due to missing native (expected on CPU runner)');
          }
          JS

      - uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: bindings/nodejs/*.tgz
          if-no-files-found: error

  nuget-package:
    runs-on: ubuntu-22.04
    needs: [natives]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The csproj multi-targets net8.0 + net9.0: both SDKs are required.
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Download linux native into runtimes/
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: bindings/csharp/runtimes/linux-x64/native/

      - name: Download windows native into runtimes/
        uses: actions/download-artifact@v8
        with:
          name: native-win-x64
          path: bindings/csharp/runtimes/win-x64/native/

      - name: Pack
        working-directory: bindings/csharp
        run: dotnet pack Tacuda.Bindings.csproj -c Release -o dist

      - name: Validate nupkg contains both natives
        working-directory: bindings/csharp
        run: |
          unzip -l dist/*.nupkg | grep "runtimes/win-x64/native/tacuda.dll"
          unzip -l dist/*.nupkg | grep "runtimes/linux-x64/native/libtacuda.so"

      - name: Runtime smoke against the packed nupkg
        run: |
          # Build a consumer against the LOCAL nupkg and run it. On a CPU
          # runner ct_version resolves the packaged native (DllImport +
          # runtimes/ probing); the only acceptable failure is a CUDA
          # runtime load error, never a packaging/P-Invoke one.
          set -e
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' bindings/csharp/Tacuda.Bindings.csproj)
          mkdir -p /tmp/nuget-smoke && cd /tmp/nuget-smoke
          dotnet new console -n SmokeApp -o . >/dev/null
          dotnet nuget add source "$GITHUB_WORKSPACE/bindings/csharp/dist" -n local-dist
          dotnet add package Tacuda -v "$VERSION"
          cat > Program.cs <<'CS'
          using System;
          using Tacuda.Bindings;
          try {
              Console.WriteLine($"native loaded, ct_version = {NativeMethods.ct_version()}");
          } catch (DllNotFoundException e) {
              // Acceptable only when the packaged native RESOLVED but its CUDA
              // runtime dependency is absent on the runner: the dlopen error
              // must name a CUDA library (libcudart/libcuda). A message that
              // fails on 'tacuda' without a CUDA cause means a broken
              // RID/probing path in the package itself -> hard fail.
              bool cudaCause = e.Message.Contains("libcudart") || e.Message.Contains("libcuda")
                  || e.Message.Contains("cudart");
              if (!cudaCause) {
                  Console.Error.WriteLine($"packaging/P-Invoke failure: {e.Message}");
                  throw;
              }
              Console.WriteLine("P/Invoke surface OK; native load fails only due to missing CUDA runtime");
          }
          CS
          dotnet run -c Release

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-dist
          path: bindings/csharp/dist/*.nupkg
          if-no-files-found: error

  # The only job that pushes to registries, and only after all three package
  # jobs validated. Registries cannot be updated atomically, so every push is
  # idempotent: a rerun after a failed push (expired token, outage) completes
  # the remaining registries instead of failing on those that already have
  # this version.
  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-24.04
    needs: [python-package, npm-package, nuget-package]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Download validated packages
        uses: actions/download-artifact@v8
        with:
          pattern: "*-dist"
          path: dist/

      # Fail before the first push rather than after a partial release.
      - name: Preflight (secrets, npm token, expected files)
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          missing=""
          [ -n "$PYPI_API_TOKEN" ] || missing="$missing PYPI_API_TOKEN"
          [ -n "$NODE_AUTH_TOKEN" ] || missing="$missing NPM_TOKEN"
          [ -n "$NUGET_API_KEY" ] || missing="$missing NUGET_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
          npm whoami
          VERSION=$(node -p "require('./bindings/nodejs/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l dist/*/
          test "$(ls dist/pypi-dist/*.whl | wc -l)" -eq 2
          test -f "dist/pypi-dist/tacuda-$VERSION.tar.gz"
          test -f "dist/npm-dist/tacuda-$VERSION.tgz"
          test -f "dist/nuget-dist/Tacuda.$VERSION.nupkg"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive --skip-existing dist/pypi-dist/*

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "dist/nuget-dist/Tacuda.$VERSION.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$(npm view "tacuda@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "tacuda@$VERSION is already on npm, skipping"
          else
            npm publish "dist/npm-dist/tacuda-$VERSION.tgz" --access public
          fi

  # Changelog automation: the GitHub release body is the top section of
  # docs/CHANGELOG.md (see docs/CONTRIBUTING.md), natives attached with
  # checksums for provenance.
  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract notes for the exact release tag
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME" --notes release_notes.md

      - name: Download natives
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: natives/
          merge-multiple: true

      - name: Checksums
        run: |
          cd natives && sha256sum * | tee ../checksums.txt
          cat ../checksums.txt >> ../release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "tacuda ${GITHUB_REF_NAME}"
          --notes-file release_notes.md
          natives/* checksums.txt
