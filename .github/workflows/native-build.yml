# Builds the native tacuda library for linux-x64 and win-x64 on every push /
# PR touching native sources, and uploads the binaries as artifacts so the
# packaging workflow (release-packages.yml) never ships stale runtimes/.
#
# GPU execution is NOT required to compile: both jobs only need the CUDA
# toolkit. Runtime tests run separately on a self-hosted GPU runner when one
# with the `gpu` label is registered.

name: native-build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "bindings/**"
      - "tests/**"
      - "benchmarks/**"
      - "scripts/**"
      - "tools/**"
      - "docs/CHANGELOG.md"
      - ".github/workflows/release-packages.yml"
      - "CMakeLists.txt"
      - ".github/workflows/native-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "bindings/**"
      - "tests/**"
      - "benchmarks/**"
      - "scripts/**"
      - "tools/**"
      - "docs/CHANGELOG.md"
      - ".github/workflows/release-packages.yml"
      - "CMakeLists.txt"
      - ".github/workflows/native-build.yml"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Generated bindings and full ABI coverage
        run: |
          python bindings/generate_bindings.py --check
          python bindings/generate_stream_bindings.py --check
          python bindings/audit_bindings.py
          python scripts/check_release.py
          python -m unittest discover -s tests/python -p 'test_release_tools.py'
          node --check bindings/nodejs/index.js
          dotnet build bindings/csharp/Tacuda.Bindings.csproj -c Release

  linux-x64:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.9.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build python3 git binutils
          cmake --version && nvcc --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90"
          -DBUILD_TESTING=OFF -DTACUDA_ENABLE_ASAN_TEST=ON

      # All targets (library + optimizer + example_app), not just the .so.
      - name: Build (all targets)
        run: cmake --build build -j "$(nproc)"

      - name: Streaming lifetime under AddressSanitizer
        run: ./build/stream_lifetime_sanitizer

      - name: Export smoke check
        run: python3 scripts/check_dll_exports.py build/libtacuda.so

      # Static coverage gate: every header symbol must be reachable from
      # Python, Node.js and C# (exits non-zero on any gap or stale decl).
      - name: Bindings coverage audit
        run: python3 bindings/audit_bindings.py

      # The streaming C# wrappers are emitted from a table; a stale checked-in
      # file would silently drift from the header.
      - name: Streaming bindings up to date
        run: python3 bindings/generate_stream_bindings.py --check

      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: build/libtacuda.so
          if-no-files-found: error

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # Mirrors scripts/build_win_dll.bat (MSVC + Ninja + CUDA toolkit),
      # with the toolkit provisioned by the action instead of E:\cuda129.
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36: includes CUDA 12.9.0
        with:
          cuda: "12.9.0"
          sub-packages: '["nvcc", "cudart", "thrust", "visual_studio_integration"]'
          method: network

      - name: Configure (MSVC + Ninja)
        shell: cmd
        run: >
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" &&
          cmake -S . -B build-win -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90"
          -DBUILD_TESTING=OFF -DTACUDA_ENABLE_ASAN_TEST=ON

      # All targets: catches MSVC-only breakage in the optimizer and
      # example_app, not just the DLL.
      - name: Build (all targets)
        shell: cmd
        run: >
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" &&
          cmake --build build-win -j 4

      - name: Streaming lifetime under AddressSanitizer
        shell: cmd
        run: >
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" &&
          build-win\stream_lifetime_sanitizer.exe

      - name: Export smoke check
        run: python scripts/check_dll_exports.py build-win/tacuda.dll

      - uses: actions/upload-artifact@v7
        with:
          name: native-win-x64
          path: build-win/tacuda.dll
          if-no-files-found: error

  # Correctness gate on a self-hosted GPU runner (label: gpu).
  # MANDATORY for version tags: release-packages.yml consumes this workflow
  # via workflow_call, and its packaging jobs wait for the whole workflow —
  # a tag release cannot ship if the GPU suite fails (or if no GPU runner
  # is registered, which is intentional: no GPU proof, no release).
  gpu-tests:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, Linux, gpu]
    needs: [linux-x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Prepare pinned reference before CTest
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r tests/requirements-reference.txt
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
          echo "TACUDA_LIBRARY=$PWD/build/libtacuda.so" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/bindings/python" >> "$GITHUB_ENV"
          .venv-ci/bin/python -c "import talib; assert len(talib.get_functions()) == 161; print(talib.__version__, talib.__ta_version__)"

      - name: Configure with tests
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=native -DBUILD_TESTING=ON
          -DPython3_EXECUTABLE="$PWD/.venv-ci/bin/python"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: C++ test suite
        run: ctest --test-dir build --output-on-failure --output-junit "$PWD/ctest.xml"

      - name: Python binding pipeline
        run: |
          cd bindings/python && python3 test_pipeline.py

      - name: Differential corpus vs TA-Lib (strict oracle)
        run: |
          export TACUDA_LIBRARY="$PWD/build/libtacuda.so"
          export PYTHONPATH="$PWD/bindings/python"
          cd benchmarks && python3 differential_corpus.py --json corpus.json

      # Same oracle, different claim: appending bars must reproduce the
      # full-series result and TA-Lib, and a batch must equal N single
      # streams on both execution paths.
      - name: Streaming corpus (incremental vs full recompute vs TA-Lib)
        run: |
          export TACUDA_LIBRARY="$PWD/build/libtacuda.so"
          export PYTHONPATH="$PWD/bindings/python"
          cd benchmarks && python3 streaming_corpus.py --json streaming_corpus.json

      - name: Batch stress smoke
        run: python3 benchmarks/benchmark_batch_api.py --quick

      - name: Node.js binding pipeline
        run: |
          cd bindings/nodejs && npm install --no-audit --no-fund && node test_pipeline.js

      # The C# surface was previously only smoke-tested at packaging time, so
      # binding-level regressions could reach a release unnoticed.
      - name: C# binding pipeline
        run: |
          export LD_LIBRARY_PATH="$PWD/build:$LD_LIBRARY_PATH"
          cd bindings/csharp/ConsoleExample
          dotnet run -c Release -f net8.0 -- --pipeline
          dotnet run -c Release -f net8.0 --no-build -- --test

      - name: Preserve correctness reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-correctness
          path: |
            ctest.xml
            benchmarks/corpus.json
            benchmarks/streaming_corpus.json
          if-no-files-found: warn
